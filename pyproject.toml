[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bootlegg"
version = "0.1.0"
description = "Detect polyfill.io and Funnull CDN malware on GitHub Pages and arbitrary websites"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "polyfill", "funnull", "cdn", "malware", "scanner"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["aiohttp>=3.9"]

[project.scripts]
bootlegg = "bootlegg.__main__:run"

[tool.setuptools.packages.find]
include = ["bootlegg*"]

[project.urls]
Homepage = "https://github.com/hwang628/bootleg"
"Bug Tracker" = "https://github.com/hwang628/bootleg/issues"
